<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Box Model 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* Khai báo Box Model cho khối div */
        div {
            margin: 25px;                   /* Lề ngoài: trên, dưới, trái, phải đều 25px */
            padding: 35px;                  /* Khoảng đệm trong: trên, dưới, trái, phải đều 35px */
            width: 200px;                   /* Chiều rộng của vùng nội dung (content) */
            background-color: lightseagreen;/* Màu nền nội dung */
            border: 20px dashed indianred;  /* Viền nét đứt màu đỏ dâu, độ dày 20px */
        }
    </style>
</head>
<body>

    <h2>Thực hành mô hình hộp (Box Model)</h2>

    <div>
        Content demo box<br/>
    </div>

</body>
</html>
